<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RoughCut Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: 12px;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #ffffff;
    }
    .card {
      background: #2a2a2a;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #6cb6ff;
    }
    label {
      display: block;
      margin-bottom: 6px;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #181818;
      border: 1px solid #444;
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      margin-top: 2px;
    }
    button {
      width: 100%;
      background: #0066cc;
      color: #fff;
      border: none;
      padding: 7px 10px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #0077ee; }
    button.secondary { background: #3d3d3d; }
    button.secondary:hover { background: #4d4d4d; }
    .row {
      display: flex;
      gap: 8px;
    }
    .row > label { flex: 1; }
    #logBox {
      background: #141414;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      min-height: 54px;
      font-family: monospace;
      font-size: 11px;
      color: #a8e6cf;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>RoughCut Studio (Offline)</h2>

  <!-- Safety & Padding Controls -->
  <div class="card">
    <h3>1. Safety Backup &amp; Cut Padding</h3>
    <label>
      <input type="checkbox" id="autoBackupChk" checked />
      Duplicate active sequence before cutting (Undo Safety)
    </label>
    <div class="row">
      <label>Pre-Speech Pad (s)
        <input type="number" id="prePadInput" value="0.15" step="0.05" min="0" max="2" />
      </label>
      <label>Post-Speech Pad (s)
        <input type="number" id="postPadInput" value="0.15" step="0.05" min="0" max="2" />
      </label>
    </div>
    <button id="backupNowBtn" class="secondary">Clone Active Sequence Now</button>
  </div>

  <!-- Actual Timeline Cutting (Silence / Cut JSON) -->
  <div class="card">
    <h3>2. Dialogue &amp; Silence Timeline Cutter</h3>
    <p style="margin:0 0 6px 0; color:#bbb;">Load a <code>silences.json</code> or <code>cuts.json</code> generated by your local FFmpeg/Whisper script to trim &amp; ripple-close gaps.</p>
    <button id="applyCutsBtn">Load Cut JSON &amp; Trim Timeline</button>
  </div>

  <!-- B-Roll & Beat Placement -->
  <div class="card">
    <h3>3. Beat Markers &amp; B-Roll Arranger</h3>
    <div class="row">
      <label>Tempo (BPM)
        <input type="number" id="bpmInput" value="120" min="40" max="240" />
      </label>
      <label>Clip Length (Beats)
        <input type="number" id="beatsPerClipInput" value="4" min="1" max="32" />
      </label>
    </div>
    <label>B-Roll Bin Name in Project
      <input type="text" id="brollBinInput" value="B-Roll" />
    </label>
    <button id="placeBrollBtn">Place B-Roll on V2 + Beat Markers</button>
  </div>

  <div id="logBox">Ready. Select a sequence to begin.</div>

  <script src="main.js"></script>
</body>
</html>
